<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Console Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* tokens copied from the live console (src/App.jsx :root) - colours unchanged, layout only */
  --bg:#0B0E13; --panel:#12161E; --panel2:#171C26; --line:#232A37; --txt:#E7EAF0; --dim:#8B94A7;
  --gold:#D4AF37; --accent:#E9E3D3; --on-accent:#15181E; --brand:var(--accent);
  --neg:#F2727F; --pos:#4CC38A; --warn:#E39A4B; --slate:#94A3B8; --blue:#5F9AD6; --teal:#56B6C2; --amber:#FBBF24;
  --band-act:#FF6A3D; --band-today:#E39A4B; --band-win:#B79A7C;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* House rule: NEVER the native scrollbar with up/down arrow buttons. Thin, dark, arrowless everywhere. */
*{scrollbar-width:thin;scrollbar-color:#2A3344 transparent}
@supports not (scrollbar-color:auto){
  ::-webkit-scrollbar{width:8px;height:8px;background:transparent}
  ::-webkit-scrollbar-thumb{background:#2A3344;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#3A4356}
  ::-webkit-scrollbar-button,::-webkit-scrollbar-corner{display:none;width:0;height:0}
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
.dim{color:var(--dim)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .r{text-align:right}
.mock{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:7px 16px;background:#10141B;border-bottom:1px dashed var(--line);font-size:12px;color:var(--dim)}
.mock b{color:var(--gold)}

/* shell */
.app{display:grid;grid-template-columns:216px 1fr;height:calc(100vh - 34px)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:3px;overflow:auto}
.brandmark{display:flex;align-items:center;gap:9px;padding:4px 8px 12px;font-weight:700;letter-spacing:.3px}
.brandmark i{width:26px;height:26px;border-radius:7px;background:var(--gold);color:#1a1405;display:grid;place-items:center;font-style:normal;font-weight:700}
.brandmark small{display:block;color:var(--dim);font-weight:400;font-size:11px;letter-spacing:0}
.nav-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--dim);text-align:left;width:100%}
.nav:hover{background:var(--panel2);color:var(--txt)}
.nav.on{background:var(--panel2);color:var(--txt)}
.nav .ic{width:16px;text-align:center}
.nav .cnt{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.nav .cnt.red{background:color-mix(in srgb,var(--neg) 18%,var(--bg));border-color:color-mix(in srgb,var(--neg) 50%,var(--line));color:var(--neg)}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line);flex:none}
.role-tag{font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.role-tag.admin{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}
.colmain{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.topbar .ttl{font-weight:700;letter-spacing:.4px}
.topbar .grow{flex:1}
.topbar select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-weight:700}
.bell{position:relative;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--neg);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.pop{position:absolute;right:24px;top:52px;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:40;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pop.show{display:block}
.pop .ph{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:600}
.pop .pi{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;cursor:pointer}
.pop .pi:hover{background:var(--panel2)}
.main{overflow:auto;padding:18px 24px 60px;flex:1}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:20px;font-weight:600}
.grow{flex:1}
.banner{padding:9px 14px;border-radius:8px;margin-bottom:12px;border:1px solid var(--line);background:var(--panel);font-size:12.5px}
.banner.warn{border-color:color-mix(in srgb,var(--amber) 45%,var(--line));background:color-mix(in srgb,var(--amber) 8%,var(--panel));color:#F4D98A}
.snap{display:flex;gap:10px;align-items:center;margin-bottom:14px;color:var(--dim)}

.btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--neg)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{padding:5px 12px;border-radius:6px;color:var(--dim);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 0 0 1px var(--line) inset}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.admin{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 55%,var(--line))}
.chip{font-size:10px;padding:0 6px;border-radius:4px;border:1px solid var(--line);margin-left:6px;font-weight:600}
.chip.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,var(--line))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);padding:12px 14px 0;display:flex;align-items:center;gap:8px}
.card .body{padding:12px 14px 14px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1fr 1fr} .g21{grid-template-columns:2fr 1fr}
.kpi{padding:14px}
.kpi .l{font-size:11.5px;color:var(--dim)}
.kpi .v{font-size:25px;font-weight:600;margin-top:2px;font-family:'IBM Plex Mono',monospace}
.kpi .d{font-size:11.5px;margin-top:2px}
.kpi.alert{border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
.kpi.tile{cursor:pointer}.kpi.tile:hover{border-color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill.np::before{display:none}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.dl{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.dl.over{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 50%,var(--line));background:color-mix(in srgb,var(--neg) 10%,var(--panel))}
.dl.today{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.bd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.tgf{color:var(--blue);font-size:12px}
.crown{color:var(--gold)}
.fire{color:var(--neg)}
.cool{font-size:10.5px;color:#7DD3FC;border:1px solid #1E4A66;border-radius:4px;padding:0 5px;margin-left:4px}
.frag{font-size:10.5px;color:#F9A8D4;background:#3B1630;border-radius:99px;padding:0 7px;margin-left:4px}
.cd{font-size:10.5px;color:var(--dim);border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-left:4px}

table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tr.div td{background:var(--bg);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;cursor:default}
.tw{overflow:auto}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.chk{appearance:none;width:16px;height:16px;border:1.5px solid var(--dim);border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;flex:none;background:transparent}
.chk:checked{background:var(--pos);border-color:var(--pos)}
.chk:checked::after{content:"✓";font-size:10px;color:#04210f;font-weight:700}
.chk.sq{border-radius:4px}
.done-t{text-decoration:line-through;color:var(--dim)}
.title-c{display:flex;align-items:center;gap:10px;min-width:220px}
.pg{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);color:var(--dim);align-items:center;gap:10px;flex-wrap:wrap}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;overflow-y:hidden}
.tabs button{padding:8px 14px;color:var(--dim);white-space:nowrap}
.tabs button.on{color:var(--txt);box-shadow:inset 0 -2px 0 var(--brand)}
.search{flex:1;min-width:180px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;outline:none}
.search:focus,.input:focus{border-color:var(--accent)}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;outline:none}
textarea.input{min-height:70px;resize:vertical}

/* plaques */
.plaques{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.plq{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.plq:hover{border-color:var(--dim)} .plq.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--panel))}
.plq .pn{display:flex;gap:7px;align-items:center;font-weight:600}
.plq .pa{font-size:11px;color:var(--dim);margin-top:3px}

/* worklist bands */
.wband{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.wband .wh{padding:11px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--cc) 6%,var(--panel))}
.wband .wh b{color:var(--cc);letter-spacing:.5px}
.wband .wh .pr{width:90px;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.wband .wh .pr i{display:block;height:100%;background:var(--cc)}
.wrow{display:grid;grid-template-columns:14px minmax(170px,1.1fr) 2fr auto 100px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.wrow:hover{background:var(--panel2)} .wrow.dimr{opacity:.55}
.wrow .sub{font-size:11.5px;color:var(--dim)}
.wrow .wm{text-align:right;font-weight:600}
.wmore{padding:8px 14px;border-top:1px solid var(--line);color:var(--dim);text-align:center;cursor:pointer}
.wmore:hover{color:var(--txt)}

/* squares / heat */
.sq7{display:inline-flex;gap:3px;vertical-align:middle}
.sq7 i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.sq7 i.w{background:var(--pos)} .sq7 i.l{background:var(--neg)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat div{border-radius:5px;padding:4px 2px;text-align:center;font-size:10px;border:1px solid var(--line);background:var(--bg)}
.heat div.w{background:color-mix(in srgb,var(--pos) 18%,var(--panel));border-color:color-mix(in srgb,var(--pos) 40%,var(--line))}
.heat div.l{background:color-mix(in srgb,var(--neg) 18%,var(--panel));border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.heat b{display:block;font-size:11px}

/* movement grid */
.mv td,.mv th{padding:6px 8px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px}
.mv td:first-child,.mv th:first-child{text-align:left;font-family:inherit;position:sticky;left:0;background:var(--panel)}
.mv tr.wk td:first-child{background:var(--panel2)}
.mv .up{background:color-mix(in srgb,var(--pos) 14%,var(--panel))} .mv .dn{background:color-mix(in srgb,var(--neg) 14%,var(--panel))}
.mv .best{box-shadow:inset 0 0 0 1px var(--pos)} .mv .worst{box-shadow:inset 0 0 0 1px var(--neg)}
.mv tbody tr{cursor:default}

/* charts */
.chart{width:100%;height:150px}
.leg{display:flex;gap:14px;font-size:11.5px;color:var(--dim);margin-top:6px}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-r{display:grid;grid-template-columns:90px 1fr 54px;gap:10px;align-items:center}
.bar-r .tr{height:10px;background:var(--bg);border-radius:99px;border:1px solid var(--line);overflow:hidden}
.bar-r .tr i{display:block;height:100%;background:var(--slate)}
.prog{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--pos)}
.lrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}.lrow:hover{background:var(--panel2)}
.rank{width:20px;color:var(--dim);font-family:'IBM Plex Mono',monospace}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:340px}
.col .ch{padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px;border-radius:var(--radius) var(--radius) 0 0}
.col .ch::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.col .ch span{margin-left:auto}
.col .ch span{color:var(--dim);font-weight:400}
.col .cb{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.drop{outline:2px dashed var(--brand);outline-offset:-4px}
.tc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:7px}
.tc:hover{border-color:var(--dim)} .tc .t{font-weight:500}
.tc .m{display:flex;justify-content:space-between;align-items:center;gap:6px}
.addq{border:1px dashed var(--line);border-radius:8px;padding:7px;color:var(--dim);text-align:center}
.addq:hover{color:var(--txt);border-color:var(--dim)}
.hello h1{font-size:22px}.hello p{color:var(--dim);margin-top:2px}
.stat{text-align:left;padding:6px 10px;border-radius:8px;border:1px solid transparent;background:none;color:inherit;cursor:pointer}
.stat:hover{background:var(--panel2);border-color:var(--line)}
.frow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.frow:last-child{border-bottom:0}.frow:hover{background:var(--panel2)}.frow .grow{flex:1;min-width:0}.frow .t{font-weight:500}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50}
.scrim.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:51;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.wide{width:min(980px,100vw)}
.drawer.show{transform:none}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.drawer .dh h2{font-size:17px;font-weight:600;flex:1}
.drawer .db{overflow:auto;padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel);align-items:center}
.pcols{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
.cellrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cellrow>div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cellrow small{display:block;color:var(--dim);font-size:11px}
.cellrow b{font-family:'IBM Plex Mono',monospace;font-size:15px}
.fields{display:grid;grid-template-columns:110px 1fr;gap:9px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.fields .k{color:var(--dim)}
.sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ck{display:flex;gap:9px;align-items:center;padding:5px 0}
.addons{display:flex;flex-wrap:wrap;gap:7px}
.addons button{padding:5px 11px;border-radius:7px;border:1px solid var(--line);color:var(--dim);background:var(--bg)}
.cm{display:flex;gap:10px;margin-bottom:12px}
.cm .bub{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;flex:1}
.cm .bub small{color:var(--dim);display:block;margin-bottom:2px}
.cm.sys .bub{background:transparent;border-style:dashed;color:var(--dim)}
.smart{border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold) 6%,var(--panel));border-radius:10px;padding:12px 14px}
.angle{display:flex;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:8px}
.rg{color:var(--neg);font-size:12px;margin-top:6px}
.stbtns{display:flex;gap:6px;flex-wrap:wrap}
.stbtns .btn.on{background:var(--brand);color:var(--on-accent);border-color:var(--brand)}
.stbtns .btn.lock{opacity:.45;cursor:not-allowed}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:52;display:none}
.modal.show{display:block}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.modal .mb{padding:16px 18px;display:grid;gap:12px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal label{display:grid;gap:5px;color:var(--dim);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:11.5px;color:var(--dim);padding:10px 14px;border-top:1px dashed var(--line)}
.lock{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;min-height:240px;text-align:center;color:var(--dim)}
.cal{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .dh2{padding:8px 10px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;border-top:1px solid var(--line)}
.cal .cell{min-height:96px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .cell:nth-child(7n+8){border-left:0}
.cal .cell.mute{opacity:.4}

function dueBadge(t){

  if(t.st==='done') return `<span class="dl dim">${fmtD(day(t.due))}</span>`;
  const cls = t.due<0?'over':t.due===0?'today':'';
  return `<span class="dl ${cls}">${t.due<0?`${fmtD(day(t.due))} · ${-t.due}d late`:t.due===0?'Today, 7:00 pm':fmtD(day(t.due))}</span>`;
}

function bucket(t){ if(t.st==='done')return'done'; if(t.due===null)return'none'; if(t.due<0)return'over'; if(t.due===0)return'today'; if(t.due<=5)return'week'; if(t.due<=12)return'next'; return'later'; }
function visibleTasks(allStatus){
  const me = ME_U;
  return tasks.filter(t=>{
    if(ROLE==='agent' && !(t.asg===me||t.own===me)) return false;
    if(state.filter==='ongoing' && !(t.asg===me&&isActive(t))) return false;
    if(state.filter==='set' && t.own!==me) return false;
    if(state.filter==='assist' && !(t.asg!==me&&t.own!==me)) return false;
    if(!allStatus && state.status==='active' && !isActive(t)) return false;
    if(!allStatus && state.status==='done' && t.st!=='done') return false;
    if(state.q && !(t.t+' '+t.tags.join(' ')).toLowerCase().includes(state.q.toLowerCase())) return false;

}

function progBar(t){

  const p = Math.min(100,(Date.now()-t.started)/(t.est*60000)*100);
  return `<div class="prog"><i data-p0="${t.started}" data-est="${t.est*60000}" style="width:${p}%;background:${p>=100?'var(--neg)':'var(--accent)'}"></i></div><div class="dim" style="margin-top:4px">Time vs ${t.est} min estimate</div>`;
}

function saCommit(){
  const dates = [...SA.dates].sort((a,b)=>a-b), ents = SA.entries.filter(e=>e.title.trim());
  if(!ents.length){ toast('Give each entry a title'); const f=document.querySelector('#saents [data-ef="title"]'); if(f&&f.focus) f.focus(); return 0; }
  if(!dates.length){ toast('Pick at least one date'); return 0; }
  if(ents.some(e=>e.type==='shift'&&!e.who.length)){ toast('Pick who works each shift'); return 0; }
  const mk = (e,o) => ({type:e.type,o,title:e.title.trim(),start:e.start,end:e.end,brands:[...e.brands],who:[...e.who],note:(e.note||'').trim(),rep:!!e.rep,off:e.title.trim().toLowerCase()==='day off'});
  if(SA.editId){ Object.assign(sch.find(x=>x.id===SA.editId), mk(ents[0],dates[0])); state.wk = Math.floor((dates[0]+1)/7); closeAll(); render(); return 1; }
  let n = 0; dates.forEach(o=>ents.forEach(e=>{ sch.push(Object.assign({id:sid++},mk(e,o))); n++; }));
  state.wk = Math.floor((dates[0]+1)/7); closeAll(); render();
  toast(`Added ${n} item${n===1?'':'s'}: ${ents.length} entr${ents.length===1?'y':'ies'} on ${dates.length} date${dates.length===1?'':'s'}`);

}
function schClick(t,e){
  let el;
  if(el=t.closest('[data-wk]')){ const v=+el.dataset.wk; state.wk = v===0?0:state.wk+v; render(); return true; }
  if(el=t.closest('[data-copyweek]')){
    const ws = -1+7*state.wk, src = sch.filter(s=>!s.rep && s.o>=ws-7 && s.o<ws), copies = src.map(s=>Object.assign({},s,{id:sid++,o:s.o+7,brands:[...s.brands],who:[...s.who]}));
    sch.push(...copies); render(); toast(copies.length?`Copied ${copies.length} one-off item${copies.length===1?'':'s'} from last week (repeating items already carry over)`:'Nothing to copy: repeating items already carry over'); return true; }
  if(!t.closest('#modal')) return false;
  if(el=t.closest('#samcal [data-cd]')){
    const o = +el.dataset.cd;
    if(SA.editId) SA.dates = new Set([o]);
    else if(e && e.shiftKey && SA.last!==null){ const a=Math.min(SA.last,o), z=Math.max(SA.last,o); for(let k=a;k<=z;k++) SA.dates.add(k); }
    else if(SA.dates.has(o)) SA.dates.delete(o); else SA.dates.add(o);
    SA.last = o; paintCal(); paintSum(); return true; }
  if(el=t.closest('#samcal [data-cmo]')){ SA.month += +el.dataset.cmo; paintCal(); return true; }
  if(el=t.closest('[data-cq]')){
    const k = el.dataset.cq, wk = n=>[0,1,2,3,4].map(i=>-1+7*n+i);
    if(k==='clear') SA.dates.clear();
    if(k==='wk0') wk(0).forEach(o=>SA.dates.add(o));
    if(k==='wk1') wk(1).forEach(o=>SA.dates.add(o));
    if(k==='wd'||k==='we'){ const first=new Date(2026,9+SA.month,1), n=new Date(2026,9+SA.month+1,0).getDate();
      for(let d=1;d<=n;d++){ const o=Math.round((new Date(2026,9+SA.month,d)-new Date(2026,9,20))/864e5); if((k==='wd')===(dowOf(o)<5)) SA.dates.add(o); } }
    paintCal(); paintSum(); return true; }
  if(el=t.closest('[data-addentry]')){ SA.entries.push(newEntry(SA.entries.length?SA.entries[SA.entries.length-1].type:undefined)); paintEnts(); paintSum(); return true; }
  if(el=t.closest('[data-delentry]')){ SA.entries.splice(+el.dataset.delentry,1); paintEnts(); paintSum(); return true; }
  if(el=t.closest('[data-qf]')){ const [i,k]=el.dataset.qf.split(':'), p=SHP[k], en=SA.entries[+i]; Object.assign(en,{type:'shift',title:p[0],start:p[1],end:p[2]}); paintEnts(); paintSum(); return true; }
  if(el=t.closest('[data-sacommit]')){ saCommit(); return true; }
  return false;
}

function tCal(){

function tGantt(){
  const rows = visibleTasks(true), W = 26, from = -8, n = 28;
  const hd = Array.from({length:n},(_,k)=>{ const d=day(from+k), we=[0,6].includes(d.getDay()); return `<div class="gh ${we?'we':''} ${from+k===0?'gt':''}">${'SMTWTFS'[d.getDay()]}<br>${d.getDate()}</div>`; }).join('');
  const bar = t => { const s = t.due===null?-1:Math.max(from,Math.min(-1,t.due-4)), e = Math.min(from+n-1, t.due===null?s+2:t.due), col = t.st==='done'?'var(--pos)':(t.due!==null&&t.due<0)?'var(--neg)':t.st==='progress'?'var(--blue)':'var(--slate)';
    return `<div class="gbar" data-open="${t.id}" style="left:${(s-from)*W}px;width:${Math.max(1,e-s+1)*W-4}px;background:${col};${t.due===null?'opacity:.45;border:1px dashed var(--txt)':''}" title="${esc(t.t)}"></div>`; };

}

  const m = document.createElement('div'), list = document.createElement('div'), opts = [...sel.options];
  const searchable = true;   // every dropdown has a search box
  const paint = q => {
    list.innerHTML = ''; const ql = (q||'').toLowerCase(); let shown = 0;
    opts.forEach((o,i)=>{
      if(ql && !o.textContent.toLowerCase().includes(ql)) return; shown++;
      const it = document.createElement('div'); it.className = 'csi'+(i===sel.selectedIndex?' on':'');
      it.innerHTML = `<span>${esc(o.textContent)}</span><span class="csk">${i===sel.selectedIndex?'✓':''}</span>`;
      it.addEventListener('click',e=>{ e.stopPropagation(); sel.selectedIndex = i; syncSel(sel); closeMenu(); sel.dispatchEvent(new Event('change',{bubbles:true})); });
      list.appendChild(it);
    });
    if(!shown){ const e = document.createElement('div'); e.className = 'csempty'; e.textContent = 'No matches'; list.appendChild(e); }
  };
  if(searchable){
    const inp = document.createElement('input'); inp.className = 'csq'; inp.type = 'text'; inp.placeholder = 'Search…';
    inp.addEventListener('input',()=>paint(inp.value));
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); const f = list.querySelector('.csi.hl')||list.querySelector('.csi'); if(f) f.click(); } });
    m.appendChild(inp);
  }
  m.appendChild(list); paint(''); showMenu(b, m, b);
  const q = m.querySelector('.csq'); if(q && q.focus) q.focus(); else { const on = m.querySelector('.csi.on'); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'}); }
}
/* --- multi select: searchable checklist (people show avatar + role) --- */
function openMsMenu(b){
  const id = b.dataset.ms, m = MS[id]; if(UI.owner===b){ closeMenu(); return; }
  const menu = document.createElement('div'), list = document.createElement('div'), foot = document.createElement('div'); let q = '';
  foot.className = 'csf';
  const paintFoot = () => { foot.innerHTML = `<span class="dim">${m.sel.length} selected</span><button type="button" class="btn sm" data-msclear>Clear</button>`; };
  const paint = () => {
    const ql = q.toLowerCase(), rows = m.items.filter(i=>!ql || (i.l+' '+(i.sub||'')).toLowerCase().includes(ql));
    list.innerHTML = rows.map(i=>`<div class="csi ${m.sel.includes(i.k)?'on':''}" data-k="${i.k}"><span class="cbx"></span>${i.c?`<i class="bd" style="background:${i.c}"></i>`:''}${i.u?av(i.u):''}<span>${esc(i.l)}</span>${i.sub?`<span class="dim" style="margin-left:auto;padding-left:14px;font-size:11.5px">${esc(i.sub)}</span>`:''}</div>`).join('') || '<div class="csempty">No matches</div>';
    paintFoot();
  };
  const commit = () => { b.querySelector('.csl').textContent = msLabel(m); if(m.onChange) m.onChange(m.sel); paint(); };
  if(true){   // every multi-select has a search box too
    const inp = document.createElement('input'); inp.className = 'csq'; inp.type = 'text'; inp.placeholder = 'Search people or brands…';
    inp.addEventListener('input',()=>{ q = inp.value; paint(); });
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); const f = list.querySelector('.csi.hl')||list.querySelector('.csi'); if(f) f.click(); } });
    menu.appendChild(inp);
  }
  list.addEventListener('click',e=>{ const it = e.target.closest('.csi'); if(!it) return; e.stopPropagation(); const k = it.dataset.k; m.sel = m.sel.includes(k)?m.sel.filter(x=>x!==k):[...m.sel,k]; commit(); });
  foot.addEventListener('click',e=>{ if(e.target.closest('[data-msclear]')){ e.stopPropagation(); m.sel = []; commit(); } });
  menu.appendChild(list); menu.appendChild(foot); paint(); showMenu(b, menu, b);
  const qi = menu.querySelector('.csq'); if(qi && qi.focus) qi.focus();
}

/* --- calendar + date picker --- */
const monthIndex = o => { const d = day(o); return (d.getFullYear()-2026)*12 + d.getMonth() - 9; };
function calHTML(mo, isSel){
  const first = new Date(2026,9+mo,1), lead = (first.getDay()+6)%7, n = new Date(2026,9+mo+1,0).getDate(), cells = [];
  for(let i=0;i<lead;i++) cells.push('<span></span>');
  for(let d=1; d<=n; d++){ const o = Math.round((new Date(2026,9+mo,d)-new Date(2026,9,20))/864e5);
    cells.push(`<button type="button" class="cdy ${isSel(o)?'on':''} ${o===0?'td':''}" data-cd="${o}">${d}</button>`); }
  return `<div class="cal-h"><button type="button" class="btn sm" data-cmo="-1">‹</button><b>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button type="button" class="btn sm" data-cmo="1">›</button></div>
    <div class="cal-w">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-g">${cells.join('')}</div>`;
}
const dpLabel = (o,empty) => (o===null||o===''||o===undefined)?(empty||'No deadline'):day(+o).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dpButton = (id,off,empty) => `<button type="button" class="csb" id="${id}" data-dp data-off="${off===null||off===undefined?'':off}" data-empty="${esc(empty||'No deadline')}"><span class="csl">${esc(dpLabel(off,empty))}</span><span class="csa">▦</span></button>`;
function openDp(b){
  if(UI.owner===b){ closeMenu(); return; }
  const cur0 = b.dataset.off===''?null:+b.dataset.off; let mo = cur0===null?0:monthIndex(cur0);
  const menu = document.createElement('div'); menu.classList.add('calpop');
  const set = o => { b.dataset.off = o===null?'':String(o); b.querySelector('.csl').textContent = dpLabel(o,b.dataset.empty); closeMenu(); };
  const paint = () => { const c = b.dataset.off===''?null:+b.dataset.off; menu.innerHTML = calHTML(mo,o=>o===c)+`<div class="cal-f"><button type="button" class="btn sm" data-dpclear>${esc(b.dataset.empty)}</button><button type="button" class="btn sm" data-dptoday>Today</button></div>`; };
  paint();
  menu.addEventListener('click',e=>{ e.stopPropagation(); const t = e.target; let el;
    if(el=t.closest('[data-cmo]')){ mo += +el.dataset.cmo; paint(); return; }
    if(el=t.closest('[data-cd]')){ set(+el.dataset.cd); return; }
    if(t.closest('[data-dpclear]')){ set(null); return; }
    if(t.closest('[data-dptoday]')){ set(0); } });
  showMenu(b, menu, b);
}
/* one capture-phase listener drives all custom controls and the schedule form */
document.addEventListener('click',e=>{
  const t = e.target, inMenu = UI.menu && UI.menu.contains(t); let b;
  if(b = t.closest('.csb')){ e.stopPropagation(); e.preventDefault(); if(b.disabled) return;
    if(b._sel) openSelMenu(b); else if(b.dataset.ms) openMsMenu(b); else if('dp' in b.dataset) openDp(b); return; }
  if(UI.menu && !inMenu) closeMenu();
  if(!inMenu && ((typeof schClick==='function' && schClick(t,e)) || (typeof taskClick==='function' && taskClick(t,e)) || (typeof dailyClick==='function' && dailyClick(t,e)))){ e.stopPropagation(); e.preventDefault(); }
},true);
document.addEventListener('keydown',e=>{
  if(!UI.menu) return;
  const its = [...UI.menu.querySelectorAll('.csi')];
  if(e.key==='Escape'){ closeMenu(); e.stopImmediatePropagation(); e.preventDefault(); return; }
  if(!its.length) return;
  let i = its.findIndex(x=>x.classList.contains('hl'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(i>=0) its[i].classList.remove('hl'); i = e.key==='ArrowDown'?Math.min(its.length-1,i+1):Math.max(0,i<0?0:i-1); its[i].classList.add('hl'); its[i].scrollIntoView({block:'nearest'}); }
  if(e.key==='Enter' && i>=0){ e.preventDefault(); its[i].click(); }
},true);
window.addEventListener('scroll',e=>{ if(UI.menu && !UI.menu.contains(e.target)) closeMenu(); },true);
if(typeof MutationObserver!=='undefined') new MutationObserver(()=>{ if(document.querySelector('select:not([data-cs])')) enhanceSelects(); }).observe(document.body,{childList:true,subtree:true});

/* drag and drop: task boards (deadline + planner) and the schedule board */
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('.tc,.sc'); if(c) e.dataTransfer.setData('text/plain', c.classList.contains('sc')?'s:'+c.dataset.sid:c.dataset.id); });
document.addEventListener('dragover',e=>{ const c=e.target.closest&&e.target.closest('.col,.lc'); if(c){ e.preventDefault(); c.classList.add('drop'); } });
document.addEventListener('dragleave',e=>{ const c=e.target.closest&&e.target.closest('.col,.lc'); if(c) c.classList.remove('drop'); });
document.addEventListener('drop',e=>{
  const c=e.target.closest&&e.target.closest('.col,.lc'); if(!c) return; e.preventDefault(); c.classList.remove('drop');
  const raw=e.dataTransfer.getData('text/plain');
  if(raw.startsWith('s:')){ if(c.dataset.sday!==undefined){ sch.find(x=>x.id===+raw.slice(2)).o=+c.dataset.sday; render(); } return; }
  if(c.dataset.sday!==undefined) return;
  const t=tasks.find(x=>x.id===+raw); if(!t) return; const k=c.dataset.col;
  if(c.dataset.stage){   // planner: stage only, deadline untouched. "In progress" = start (one ongoing rule applies)
    const s=c.dataset.stage;
    if(s==='ip'){ if(t.st!=='progress' && !startTask(t.id)){ render(); return; } t.stage=undefined; }
    else { if(t.st==='progress') setStatus(t.id,'pending'); t.stage=s; }
    render(); return;
  }
  if(k==='done'){ setStatus(t.id,'done'); render(); return; }
  if(t.st==='done') t.st='pending';
  t.due=COL_DUE[k]; render();
});

/* deep link for reviewing a screen directly: file.html#view/sub/extra */
(()=>{ const h=location.hash.slice(1).split('/'); if(!h[0]||!VIEWS[h[0]]) return; state.view=h[0];
  const sub=h[1]; if(sub){ if(h[0]==='queue') applyQueueSub(sub); if(h[0]==='delta') state.dv=sub; if(h[0]==='tasks') state.tv=sub; if(h[0]==='sched') state.sv=sub; if(h[0]==='perf'||h[0]==='mine') state.pf=sub; }
  window.__extra=h[2]||''; })();
render();
(()=>{ const x=window.__extra||''; if(!x) return; if(x==='filters'||x==='types'||x==='brand') state.dd=x, render(); else if(/^task\d+$/.test(x)) openTask(+x.slice(4)); else if(/^player\d+$/.test(x)) openPlayer(+x.slice(6)); else if(x==='new') openNew(); else if(x==='tl') openTeamTasks('sara','assigned'); else if(x==='sch') openSch(null,3,'reload'); else if(x==='menu') setTimeout(()=>{ const b=document.querySelector('.csb'); if(b) b.click(); },100); else if(x==='dp'){ openNew(); setTimeout(()=>{ const b=document.getElementById('ndd'); if(b) b.click(); },150); } else if(x==='schedit') openSch(5); else if(x==='newobs'||x==='newobsq'){ openNew(); setTimeout(()=>{ const b=document.querySelector('[data-ms="obs"]'); if(b) b.click(); if(x==='newobsq') setTimeout(()=>{ const q=document.querySelector('.csq'); if(q){ q.value='ma'; q.dispatchEvent(new Event('input')); } },80); },150); } else if(x==='samulti'){ openSch(null,0,'shift'); [0,1,2,3,4].forEach(o=>SA.dates.add(o)); SA.entries=[Object.assign(newEntry('shift'),{title:'Morning',start:'09:00',end:'17:00'}),Object.assign(newEntry('reload'),{title:'Friday Reload 12%',brands:['LPK777','ACE33']})]; paintCal(); paintEnts(); paintSum(); } else if(x==='samenu'){ openSch(null,0,'shift'); setTimeout(()=>{ const b=document.querySelector('#saents .csb'); if(b) b.click(); },150); } })();
</script>
